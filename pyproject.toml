[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-observability-lib"
version = "1.0.0"
description = "Shared library for structured logging, ASGI middleware, and OpenTelemetry tracing."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "structlog>=24.0.0",
    "opentelemetry-api>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-exporter-otlp>=1.41.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.136.1",
    "opentelemetry-instrumentation-fastapi>=0.63b0",
]

dev = [
    "pytest>=9.0.3",
    "httpx>=0.28.1"
]